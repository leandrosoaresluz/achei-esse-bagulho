<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achei Esse Bagulho</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f1a;
      --surface: #1a1a2e;
      --card:    #16213e;
      --accent:  #f97316;
      --tg:      #0088cc;
      --text:    #f0f0f0;
      --muted:   #8888aa;
      --radius:  14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 36px 20px 28px;
    }
    .header::after {
      content: '';
      display: block;
      width: 60px; height: 3px;
      background: var(--accent);
      margin: 16px auto 0;
      border-radius: 2px;
    }
    .logo {
      width: 160px;
      border-radius: 28px;
      margin-bottom: 14px;
      box-shadow: 0 8px 32px rgba(249,115,22,.25);
    }
    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 2px;
      line-height: 1;
    }
    .header p { color: var(--muted); font-size: .9rem; margin-top: 6px; }

    /* ── Botão Telegram ── */
    .btn-tg {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--tg);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 16px 24px;
      border-radius: var(--radius);
      max-width: 420px;
      margin: 0 auto 12px;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 4px 20px rgba(0,136,204,.3);
    }
    .btn-tg:active { opacity: .85; transform: scale(.98); }

    .btn-yt {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ff0000;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 16px 24px;
      border-radius: var(--radius);
      max-width: 420px;
      margin: 0 auto 12px;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 4px 20px rgba(255,0,0,.25);
    }
    .btn-yt:active { opacity: .85; transform: scale(.98); }

    .btn-ig {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 16px 24px;
      border-radius: var(--radius);
      max-width: 420px;
      margin: 0 auto 24px;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 4px 20px rgba(220,39,67,.25);
    }
    .btn-ig:active { opacity: .85; transform: scale(.98); }

    /* ── Seção produtos ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      max-width: 480px;
      margin: 0 auto 16px;
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: var(--accent);
    }
    .section-count {
      font-size: .8rem;
      color: var(--muted);
    }
    .btn-refresh {
      background: none;
      border: 1px solid rgba(255,255,255,.15);
      color: var(--muted);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: .75rem;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
    .btn-refresh.girando { animation: girar .6s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 0 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,.06);
      animation: fadeUp .35s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      padding: 10px;
    }
    .card-img-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: #1e1e3a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .card-body {
      padding: 10px 10px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-name {
      font-size: .78rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-price {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .card-btn {
      display: block;
      background: var(--accent);
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: .8rem;
      padding: 9px 6px;
      border-radius: 8px;
      margin-top: auto;
      transition: opacity .2s;
    }
    .card-btn:active { opacity: .8; }

    /* ── Infinite scroll sentinel ── */
    #sentinel {
      height: 1px;
      margin-top: 20px;
    }

    /* ── Loader ── */
    .loader {
      text-align: center;
      padding: 24px 20px;
      color: var(--muted);
      font-size: .85rem;
      grid-column: 1 / -1;
    }
    .loader span {
      display: inline-block;
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      margin: 0 3px;
      animation: bounce .8s infinite;
    }
    .loader span:nth-child(2) { animation-delay: .15s; }
    .loader span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,80%,100% { transform:translateY(0); }
      40%          { transform:translateY(-7px); }
    }

    .fim-lista {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      padding: 24px;
      grid-column: 1 / -1;
    }

    .tiktok-hint {
      text-align: center;
      color: var(--muted);
      font-size: .75rem;
      max-width: 420px;
      margin: -20px auto 28px;
      padding: 0 20px;
      line-height: 1.5;
    }
    .tiktok-hint strong { color: #aaa; }

    /* ── Busca ── */
    .search-wrap {
      padding: 0 16px 20px;
      max-width: 480px;
      margin: 0 auto;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      padding: 12px 16px 12px 42px;
      color: var(--text);
      font-size: .95rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    .search-wrap-inner {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .search-empty {
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
      padding: 40px 20px;
      grid-column: 1 / -1;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: .75rem;
      padding: 32px 20px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="logo_ambos2.PNG" alt="Achei Esse Bagulho" class="logo">
    <p>Os melhores achados da internet!</p>
  </div>

  <a href="https://t.me/AcheiEsseBagulho" class="btn-tg">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248-1.97 9.289c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.932z"/></svg>
    📲 Entrar no Grupo
  </a>
  <a href="https://www.youtube.com/@acheiessebagulho-u1c" class="btn-yt" target="_blank" rel="noopener">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>
    Canal no YouTube
  </a>

  <a href="https://www.instagram.com/acheiessebagulho" class="btn-ig" target="_blank" rel="noopener">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
    Instagram
  </a>

  <p class="tiktok-hint">
    Veio pelo TikTok? Toque em <strong>···</strong> → <strong>Abrir no navegador</strong> primeiro
  </p>

  <div class="search-wrap">
    <div class="search-wrap-inner">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" class="search-input" id="busca"
             placeholder="Buscar produto..." autocomplete="off">
    </div>
  </div>

  <div class="section-header">
    <div class="section-title">🔥 Ofertas</div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="section-count" id="contagem"></div>
      <button class="btn-refresh" id="btn-refresh" onclick="recarregar()" title="Atualizar ofertas">↻</button>
    </div>
  </div>

  <div id="grid" class="grid">
    <div class="loader">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div id="sentinel"></div>

  <div class="footer">
    Links de afiliado — você paga o mesmo preço e apoia o canal 🙏
  </div>

  <script>
    const POR_PAGINA = 20;
    let todos = [];
    let pagina = 0;
    let carregando = false;
    let acabou = false;

    function criarCard(p, delay) {
      const img = p.imagem
        ? `<img class="card-img" src="${p.imagem}" alt="" loading="lazy"
             onerror="this.outerHTML='<div class=card-img-placeholder>🛍️</div>'">`
        : '<div class="card-img-placeholder">🛍️</div>';

      const div = document.createElement('div');
      div.className = 'card';
      div.style.animationDelay = delay + 's';
      div.innerHTML = `
        ${img}
        <div class="card-body">
          <div class="card-name">${p.nome}</div>
          ${p.preco ? `<div class="card-price">R$ ${p.preco}</div>` : ''}
          <a href="${p.url}" class="card-btn" target="_blank" rel="noopener">Comprar</a>
        </div>`;
      return div;
    }

    function mostrarMais() {
      if (carregando || acabou) return;
      carregando = true;

      const grid   = document.getElementById('grid');
      const inicio = pagina * POR_PAGINA;
      const fatia  = todos.slice(inicio, inicio + POR_PAGINA);

      if (fatia.length === 0) {
        acabou = true;
        if (pagina > 0) {
          const fim = document.createElement('div');
          fim.className = 'fim-lista';
          fim.textContent = '✅ Todas as ofertas carregadas';
          grid.appendChild(fim);
        }
        carregando = false;
        return;
      }

      fatia.forEach((p, i) => {
        grid.appendChild(criarCard(p, i * 0.05));
      });

      pagina++;
      carregando = false;

      if (pagina * POR_PAGINA >= todos.length) {
        acabou = true;
        if (todos.length > POR_PAGINA) {
          const fim = document.createElement('div');
          fim.className = 'fim-lista';
          fim.textContent = '✅ Todas as ofertas carregadas';
          grid.appendChild(fim);
        }
      }
    }

    // ── Busca ──────────────────────────────────────────────
    let termoBusca = '';
    let todosFiltrados = [];

    function filtrar(termo) {
      termoBusca = termo.toLowerCase().trim();
      todosFiltrados = termoBusca
        ? todos.filter(p => p.nome.toLowerCase().includes(termoBusca))
        : todos;

      const count = todosFiltrados.length;
      document.getElementById('contagem').textContent =
        termoBusca
          ? `${count} resultado${count !== 1 ? 's' : ''} para "${termo}"`
          : `${todos.length} ofertas`;

      pagina   = 0;
      acabou   = false;
      carregando = false;
      document.getElementById('grid').innerHTML = '';
      document.getElementById('sentinel').style.display = '';

      if (count === 0) {
        document.getElementById('grid').innerHTML =
          `<div class="search-empty">Nenhuma oferta encontrada para "<strong>${termo}</strong>"</div>`;
        document.getElementById('sentinel').style.display = 'none';
        return;
      }
      mostrarMais();
    }

    function mostrarMais() {
      if (carregando || acabou) return;
      carregando = true;

      const lista  = todosFiltrados.length ? todosFiltrados : todos;
      const grid   = document.getElementById('grid');
      const inicio = pagina * POR_PAGINA;
      const fatia  = lista.slice(inicio, inicio + POR_PAGINA);

      if (fatia.length === 0) {
        acabou = true;
        if (pagina > 0) {
          const fim = document.createElement('div');
          fim.className = 'fim-lista';
          fim.textContent = '✅ Todas as ofertas carregadas';
          grid.appendChild(fim);
        }
        carregando = false;
        return;
      }

      fatia.forEach((p, i) => grid.appendChild(criarCard(p, i * 0.05)));
      pagina++;
      carregando = false;

      if (pagina * POR_PAGINA >= lista.length) {
        acabou = true;
        if (lista.length > POR_PAGINA) {
          const fim = document.createElement('div');
          fim.className = 'fim-lista';
          fim.textContent = '✅ Todas as ofertas carregadas';
          grid.appendChild(fim);
        }
      }
    }

    async function init() {
      const grid = document.getElementById('grid');
      try {
        const res  = await fetch('products.json?t=' + Date.now());
        const data = await res.json();

        if (!data.produtos || data.produtos.length === 0) {
          grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;padding:40px">Em breve!</p>';
          return;
        }

        todos          = [...data.produtos].reverse();
        todosFiltrados = todos;
        document.getElementById('contagem').textContent = todos.length + ' ofertas';

        grid.innerHTML = '';
        mostrarMais();

        // Infinite scroll
        const sentinel = document.getElementById('sentinel');
        const observer = new IntersectionObserver(entries => {
          if (entries[0].isIntersecting) mostrarMais();
        }, { rootMargin: '200px' });
        observer.observe(sentinel);

        // Busca com debounce
        let debounce;
        document.getElementById('busca').addEventListener('input', e => {
          clearTimeout(debounce);
          debounce = setTimeout(() => filtrar(e.target.value), 300);
        });

      } catch(e) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;padding:40px">Carregando...</p>';
      }
    }

    function recarregar() {
      const btn = document.getElementById('btn-refresh');
      btn.classList.add('girando');
      todos = []; todosFiltrados = []; pagina = 0; acabou = false; carregando = false;
      document.getElementById('grid').innerHTML = '<div class="loader"><span></span><span></span><span></span></div>';
      document.getElementById('busca').value = '';
      termoBusca = '';
      init().finally(() => btn.classList.remove('girando'));
    }

    init();
  </script>
</body>
</html>
